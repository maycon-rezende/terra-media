<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Portal da Terra Média</title>
  <style>
    body {
     background: url('imagens/mellon.avif') center center / cover no-repeat fixed;
      background-size: cover;
      font-family: 'Cinzel', serif;
     color: #ffffff;
    text-shadow: 2px 2px 4px #000;


      text-align: center;
      padding-top: 100px;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px #000;
    }

    input {
      padding: 10px;
      font-size: 1em;
      border-radius: 5px;
      border: none;
      width: 200px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      background-color: #444;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #666;
    }

    .fade-in {
      animation: fadeIn 2s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <h2>Fale, amigo, e entre.</h2>
  <input type="text" id="palavraSecreta" placeholder="Digite a palavra...">
  <br>
  <button onclick="verificarPalavra()">Entrar</button>

  <script>
    function verificarPalavra() {
      const entrada = document.getElementById("palavraSecreta").value.trim().toLowerCase();
      if (entrada === "mellon") {
        document.body.classList.add("fade-in");
        setTimeout(() => {
          window.location.href = "terra-media.html"; // redireciona após animação
        }, 2000);
      } else {
        alert("Nada acontece... tente novamente.");
      }
    }
  </script>
</body>
</html>
